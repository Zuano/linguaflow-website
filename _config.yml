# Tells GitHub Pages (Jekyll) to publish the hidden folder .well-known.
# Sagt GitHub Pages, dass der versteckte Ordner .well-known mitveroeffentlicht wird.
include:
  - ".well-known"

# Internal notes: do not publish.
# Interne Notizen: nicht veroeffentlichen.
exclude:
  - "CONTEXT.md"
  - "linguaflow-briefing.md"
