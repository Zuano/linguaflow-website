<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <!-- Only our own files and our own server are allowed. No inline scripts, no third parties.
       Nur eigene Dateien und der eigene Server sind erlaubt. Keine fremden Dienste. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://europe-west1-linguaflow-firebase.cloudfunctions.net; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>LinguaFlow</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="stylesheet" href="player.css">
  <script type="module" src="player.js"></script>
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <a class="logo" href="https://linguaflow.app/">Lingua<span>Flow</span></a>
      <a id="open-app" class="btn" hidden></a>
    </div>
  </header>

  <main class="wrap">
    <div id="status" class="status is-loading" role="status" aria-live="polite">
      <p id="status-text" class="status-text"></p>
      <p id="status-hint" hidden></p>
      <button type="button" id="retry" class="btn" hidden></button>
    </div>

    <noscript>
      <p class="status-text">Diese Seite braucht JavaScript, um den geteilten Text zu zeigen. / This page needs JavaScript to show the shared text.</p>
    </noscript>

    <article id="share" hidden>
      <h1 id="title" dir="auto"></h1>
      <div id="toggles" class="toggles" role="group">
        <button type="button" id="toggle-t" class="chip" aria-pressed="false"></button>
        <button type="button" id="toggle-o" class="chip" aria-pressed="false"></button>
      </div>
      <div id="text"></div>
    </article>

    <section id="get-app" class="get-app" hidden>
      <p id="get-app-text"></p>
      <div class="badges">
        <a id="store-ios" target="_blank" rel="noopener noreferrer"><img id="store-ios-img" src="img/badge-appstore.svg" width="144" height="48" alt=""></a>
        <a id="store-android" target="_blank" rel="noopener noreferrer"><img id="store-android-img" src="img/badge-playstore.svg" width="162" height="48" alt=""></a>
      </div>
    </section>
  </main>

  <footer class="foot wrap">
    <p id="expires" hidden></p>
    <nav class="foot-links">
      <a id="link-imprint"></a>
      <a id="link-privacy"></a>
      <a id="link-report" hidden></a>
    </nav>
  </footer>

  <div id="player" class="player" role="group" hidden>
    <div class="wrap player-row">
      <button type="button" id="play" class="btn play">
        <svg class="icon icon-play" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        <svg class="icon icon-pause" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z"/></svg>
        <span id="play-label"></span>
      </button>
      <div id="speeds" class="speeds" role="group">
        <button type="button" class="chip" data-rate="0.5" aria-pressed="false"></button>
        <button type="button" class="chip" data-rate="0.75" aria-pressed="false"></button>
        <button type="button" class="chip" data-rate="1" aria-pressed="true"></button>
      </div>
    </div>
  </div>
</body>
</html>
